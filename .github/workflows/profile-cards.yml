name: Generate profile summary cards

# The third-party stat services (github-readme-stats, streak-stats,
# activity-graph) are shared free instances and were returning errors, which is
# why the METRICS block rendered as broken images. These cards are generated
# here instead and committed into this repository, so the README only ever
# points at files we own.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5
          AUTO_PUSH: true
          THEME: "2077"
          ANIMATION: "sequence"
